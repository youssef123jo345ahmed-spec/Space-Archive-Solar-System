<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Archive | Solar System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#02030b;color:#fff;overflow-x:hidden}
body.exploring{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
body.exploring.dragging{cursor:grabbing}
body.exploring button{cursor:pointer}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
.overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(2,5,20,.88),rgba(2,5,20,.45) 45%,transparent)}
.lang-btn{position:fixed;top:30px;right:35px;z-index:100;padding:12px 25px;border:1px solid #55baff;border-radius:30px;background:rgba(10,25,55,.7);color:#70caff;font-size:14px;font-weight:bold;cursor:pointer;backdrop-filter:blur(12px);transition:.3s}
.lang-btn:hover{background:#1689ff;color:#fff;box-shadow:0 0 25px #1689ff;transform:translateY(-3px)}
.space-controls{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;max-width:calc(100vw - 24px);padding:8px;overflow-x:auto;scrollbar-width:none;background:rgba(10,25,55,.55);border:1px solid rgba(90,180,255,.3);border-radius:40px;backdrop-filter:blur(14px)}
.space-controls::-webkit-scrollbar{display:none}
.space-controls button{flex-shrink:0;white-space:nowrap;padding:10px 19px;border:1px solid rgba(90,180,255,.5);border-radius:25px;background:rgba(10,25,55,.7);color:#fff;cursor:pointer;font-size:13px;backdrop-filter:blur(12px);transition:.3s}
.space-controls button.active{background:#1689ff;border-color:#ffe066;box-shadow:0 0 20px #1689ff}
.space-controls button:hover{background:#1689ff;box-shadow:0 0 25px #1689ff;transform:translateY(-3px)}
.hero{min-height:100vh;display:flex;align-items:center;padding:8%;position:relative}
.hero-inner{max-width:600px}
.content{max-width:600px;transition:opacity 1.2s ease}
.content.fade-out{opacity:0;pointer-events:none}
.tag{display:inline-block;color:#77caff;border:1px solid #347cb9;padding:10px 18px;border-radius:30px;font-size:13px;letter-spacing:2px;margin-bottom:25px;background:#0b1a302b}
h1{font-size:clamp(36px,5.5vw,73px);line-height:1.3;margin-bottom:20px;color:#fff;text-shadow:0 0 25px #4b8bff66}
h1 span,.about h2 span{color:#63baff}
.description{font-size:15px;color:#c1c9da;line-height:1.9;max-width:500px;margin-bottom:30px}
.footer{position:absolute;bottom:25px;left:35px;color:#9caac5;font-size:12px;letter-spacing:2px;direction:ltr}
.about{min-height:55vh;padding:100px 8%;background:rgba(3,7,21,.96);text-align:center;transition:opacity 1.2s ease}
.about.fade-out{opacity:0;pointer-events:none}
.about h2{font-size:clamp(26px,4.7vw,39px);margin-bottom:25px}
.about p{max-width:700px;margin:auto;color:#aab8d0;line-height:2;font-size:15px}

.equip-panel{position:fixed;top:78px;left:30px;z-index:20;width:232px;max-height:calc(100vh - 200px);overflow-y:auto;padding:12px 11px;background:rgba(10,25,55,.78);border:1px solid rgba(90,180,255,.45);border-radius:18px;backdrop-filter:blur(14px);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease;cursor:default;user-select:none}
body.exploring .equip-panel{opacity:1;pointer-events:auto;transform:none}
.equip-panel h3{font-size:13px;color:#77caff;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(90,180,255,.3)}
.equip-item{display:block;width:100%;margin-bottom:5px;padding:7px 10px;text-align:start;font-size:11.5px;line-height:1.45;color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(90,180,255,.25);border-radius:10px;cursor:pointer;transition:.25s;direction:auto}
.equip-item:hover{background:rgba(22,137,255,.55);border-color:#55baff}
.equip-item.active{background:rgba(22,137,255,.75);border-color:#ffe066;box-shadow:0 0 14px rgba(255,224,102,.45)}

.hint{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:6;padding:8px 18px;font-size:12px;color:#bfe3ff;background:rgba(10,25,55,.7);border:1px solid rgba(90,180,255,.4);border-radius:20px;backdrop-filter:blur(8px);pointer-events:none;opacity:0;transition:opacity .8s ease;white-space:normal;max-width:90vw;text-align:center;direction:auto}
body.exploring .hint{opacity:1}

#labels{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.poi-label{position:absolute;left:0;top:0;display:flex;align-items:center;white-space:nowrap;margin:-5px 0 0 -5px;opacity:0;transition:opacity .8s ease;will-change:transform}
.poi-label.show{opacity:1}
.poi-dot{width:10px;height:10px;border:1.5px solid #ffe066;border-radius:50%;box-shadow:0 0 10px #ffe066;flex-shrink:0}
.poi-text{margin:0 0 0 10px;padding:4px 11px;font-size:12px;color:#fff;background:rgba(10,25,55,.78);border:1px solid rgba(255,224,102,.55);border-radius:14px;backdrop-filter:blur(8px);direction:auto}

.media-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:34px;background:radial-gradient(circle at 30% 30%,rgba(22,137,255,.35),rgba(10,25,55,.9));border:1px dashed rgba(90,180,255,.45)}
.media-ph small{font-size:10px;color:#9fc9ee}
.media-img img{display:block;width:100%;height:100%;object-fit:cover}
.story-btn{width:100%;padding:7px 10px;font-size:12px;color:#fff;background:#1689ff;border:0;border-radius:10px;cursor:pointer;transition:.25s}
.story-btn:hover{box-shadow:0 0 14px #1689ff}

.story{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(2,5,20,.82);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .5s ease}
.story.open{opacity:1;pointer-events:auto}
.story-box{position:relative;display:flex;width:min(920px,100%);max-height:88vh;overflow:hidden;background:rgba(10,25,55,.94);border:1px solid rgba(90,180,255,.5);border-radius:22px;box-shadow:0 0 60px rgba(22,137,255,.25);transform:scale(.96);transition:transform .5s ease}
.story.open .story-box{transform:none}
.story-media{flex:0 0 40%;min-height:280px;background:#050a1a}
.story-media>div{width:100%;height:100%;border-radius:0;border:0;font-size:70px}
.story-text{flex:1;padding:34px 30px;overflow-y:auto;cursor:auto;user-select:text}
.story-text h2{font-size:26px;margin-bottom:8px;color:#fff;direction:auto}
.story-meta{margin-bottom:18px;padding-bottom:14px;font-size:13px;line-height:1.8;color:#77caff;border-bottom:1px solid rgba(90,180,255,.3);direction:auto}
.story-kicker{font-size:13px;color:#77caff;margin-bottom:8px;direction:auto}
.story-text .story-title{font-size:28px;line-height:1.5;margin-bottom:14px;color:#fff}
.story-sep{height:2px;width:70px;margin-bottom:18px;background:linear-gradient(90deg,#1689ff,transparent);border-radius:2px}
@keyframes storyIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.story.open .story-title,.story.open .story-kicker{animation:storyIn .7s ease both}
.story.open .story-sep{animation:storyIn .7s ease .35s both}
.story.open .story-body{animation:storyIn .9s ease .7s both}
.story-body{font-size:15px;line-height:2;color:#d3dbea;direction:auto}
.story-body p{margin-bottom:14px}
.story-empty{color:#8fa6c7;font-style:italic}
.story-close{position:absolute;top:14px;inset-inline-end:14px;z-index:2;width:38px;height:38px;border:1px solid #55baff;border-radius:50%;background:rgba(10,25,55,.85);color:#70caff;font-size:16px;cursor:pointer;transition:.25s}
.story-close:hover{background:#1689ff;color:#fff}
.info-box{width:min(480px,100%);flex-direction:column}
.info-box .story-media{flex:0 0 200px;min-height:0}
.info-box .story-text{padding:22px 24px 24px}
.info-box .story-text h2{font-size:22px}
.info-box .story-meta{border-bottom:0;padding-bottom:0;font-size:14px;color:#c1c9da}
.info-box .story-btn{padding:10px 14px;font-size:14px}

@media(max-width:700px){
.hero{align-items:flex-end;padding:10% 7% 32%}
.overlay{background:linear-gradient(0deg,rgba(2,5,20,.97),rgba(2,5,20,.3))}
.footer{left:15px;bottom:12px;font-size:9px}
.lang-btn{top:18px;right:18px;padding:10px 20px}
.space-controls{bottom:38px;gap:6px;padding:6px}
.space-controls button{padding:10px 17px;font-size:12px}
.about{padding:75px 7%}
.hint{bottom:100px;font-size:11px}
.equip-panel{top:64px;left:12px;right:12px;width:auto;max-height:24vh;padding:9px}
.equip-panel h3{font-size:12px;margin-bottom:6px;padding-bottom:6px}
.equip-item{padding:6px 9px;font-size:11px;margin-bottom:4px}
.story{padding:12px}
.story-box{flex-direction:column}
.story-media{flex:0 0 180px;min-height:0}
.story-text{padding:20px 18px}
.story-text h2,.story-text .story-title{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
.lang-btn,.space-controls button,.content,.about,.hint,.poi-label,.story,.story-box{transition:none}
.story.open .story-title,.story.open .story-kicker,.story.open .story-sep,.story.open .story-body{animation:none}
}
</style>
</head>
<body>

<canvas id="space"></canvas>
<div class="overlay"></div>

<button id="langBtn" class="lang-btn">ENGLISH</button>

<div id="labels"></div>
<div id="hint" class="hint"></div>

<aside id="equipPanel" class="equip-panel">
    <h3 id="equipTitle"></h3>
    <div id="equipList"></div>
</aside>

<div id="info" class="story info">
    <div class="story-box info-box">
        <button id="infoClose" type="button" class="story-close">✕</button>
        <div id="infoMedia" class="story-media"></div>
        <div class="story-text">

</div>

<div id="story" class="story">
    <div class="story-box">
        <button id="storyClose" type="button" class="story-close">✕</button>

            <p id="storyName" class="story-kicker"></p>
            <h2 id="storyTitle" class="story-title"></h2>

</div>

<main class="hero">
    <div class="hero-inner">
        <div class="content" id="heroContent">
            <div class="tag" id="tag">✦ رحلة عبر الفضاء</div>
            <h1 id="mainTitle">اكتشف <span>الكون</span><br>وما وراءه</h1>
            <p class="description" id="mainDescription">أرشيف الفضاء هو منصة تفاعلية تستكشف تاريخ المهمات الفضائية والمركبات والمركبات الجوالة على القمر والمريخ وما وراءهما.</p>
        </div>

        <div class="space-controls">
            <button data-btn="moon" onclick="focusSpaceObject('moon')">🌙 القمر</button>
            <button data-btn="mars" onclick="focusSpaceObject('mars')">🔴 المريخ</button>
            <button data-btn="ceres" onclick="focusSpaceObject('ceres')">☄️ سيريس</button>
            <button data-btn="eros" onclick="focusSpaceObject('eros')">🪨 إيروس</button>
            <button data-btn="pioneer" onclick="focusSpaceObject('pioneer')">🚀 بايونير</button>
            <button data-btn="kepler" onclick="focusSpaceObject('kepler')">🔭 كبلر</button>
        </div>
    </div>

<!-- TRANSLATION -->
<script>
const translations = {
    ar: {
        button: "ENGLISH", direction: "rtl",
        tag: "✦ رحلة عبر الفضاء",
        title: 'اكتشف <span>الكون</span><br>وما وراءه',
        description: "انطلق في رحلة استثنائية عبر أعماق الكون. اكتشف الشمس والكواكب الثمانية، واستكشف أسرار المجرات والعوالم البعيدة التي تنتظر من يكتشفها.",
        footer: "SPACE ARCHIVE — EXPLORE THE UNIVERSE",
        moon: "🌙 القمر", mars: "🔴 المريخ", ceres: "☄️ سيريس", eros: "🪨 إيروس", pioneer: "🚀 بايونير", kepler: "🔭 كبلر",
        hint: "اسحب للتدوير · العجلة للتقريب · اضغط على معدة لتحديدها · دبل كليك للمعلومات والقصة"
    },
    en: {
        button: "العربية", direction: "ltr",
        tag: "✦ A JOURNEY THROUGH SPACE",
        title: 'Discover the <span>Universe</span><br>and Beyond',
        description: "Embark on an extraordinary journey through the depths of space. Discover the Sun and its eight planets, explore distant worlds, and uncover the mysteries of our incredible universe.",
        footer: "SPACE ARCHIVE — EXPLORE THE UNIVERSE",
        moon: "🌙 Moon", mars: "🔴 Mars", ceres: "☄️ Ceres", eros: "🪨 Eros", pioneer: "🚀 Pioneer", kepler: "🔭 Kepler",
        hint: "Drag to rotate · Scroll to zoom · Click an item to select · Double-click for details & story"
    }
};

function showSpaceError(msg) {
    if (window.__spaceReady || document.getElementById("spaceError")) return;
    const box = document.createElement("div");
    box.id = "spaceError";
    box.style.cssText = "position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:999;max-width:90%;padding:12px 18px;border-radius:12px;background:#7a1620;color:#fff;font:13px/1.6 Arial,sans-serif;direction:ltr;text-align:left";
    box.textContent = msg;
    document.body.appendChild(box);
}
window.addEventListener("error", function (e) {
    showSpaceError("Error: " + (e.message || "script failed") + (e.lineno ? " (line " + e.lineno + ")" : ""));
});
window.addEventListener("load", function () {
    setTimeout(function () {
        showSpaceError("3D scene did not start. Three.js may be blocked or not loading (check internet / open the file in Chrome).");
    }, 4000);
});

let currentLang = "ar";
document.getElementById("hint").textContent = translations.ar.hint;

document.getElementById("langBtn").addEventListener("click", function () {
    currentLang = currentLang === "ar" ? "en" : "ar";
    const lang = translations[currentLang];
    document.documentElement.lang = currentLang;
    document.documentElement.dir = lang.direction;
    document.getElementById("langBtn").textContent = lang.button;
    document.getElementById("tag").textContent = lang.tag;
    document.getElementById("mainTitle").innerHTML = lang.title;
    document.getElementById("mainDescription").textContent = lang.description;
    document.getElementById("footer").textContent = lang.footer;
    document.querySelectorAll("[data-btn]").forEach((b) => { b.textContent = lang[b.dataset.btn]; });
    document.getElementById("hint").textContent = lang.hint;
});
</script>

{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";

/* 1. SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030b);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 24, 53);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({canvas: document.getElementById("space"), antialias: true, powerPreference: "high-performance"});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

/* 2. LIGHTING */
scene.add(new THREE.AmbientLight(0x8a9bc4, 0.9));
scene.add(new THREE.PointLight(0xffd9a0, 1800, 150, 1.5));

/* 3. TEXTURES */
function createTexture(type, colors) {
    const canvas = document.createElement("canvas");
    canvas.width = 512; canvas.height = 256;
    const ctx = canvas.getContext("2d");
    const gradient = ctx.createLinearGradient(0, 0, 0, 256);
    colors.forEach((c, i) => gradient.addColorStop(i / (colors.length - 1), c));
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 512, 256);

    if (type === "earth") {
        ctx.fillStyle = "#27864c";
        for (let i = 0; i < 35; i++) {
            ctx.beginPath();
            ctx.ellipse(Math.random() * 512, Math.random() * 256, Math.random() * 25 + 5, Math.random() * 15 + 4, Math.random() * 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = "#c8e9fa";
        ctx.fillRect(0, 0, 512, 12);
        ctx.fillRect(0, 244, 512, 12);
    }
    if (type === "jupiter") {
        for (let i = 0; i < 256; i += 15) {
            ctx.fillStyle = i % 30 === 0 ? "#9c6347" : "#e6c69c";
            ctx.fillRect(0, i, 512, 8 + Math.random() * 8);
        }
        ctx.fillStyle = "#b45b40";
        ctx.beginPath();
        ctx.ellipse(340, 155, 32, 15, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    if (type === "saturn") {
        for (let i = 0; i < 256; i += 12) {
            ctx.fillStyle = i % 24 === 0 ? "#a17a4f" : "#e9d1a0";
            ctx.fillRect(0, i, 512, 7);
        }
    }
    if (type === "moon") {
        for (let i = 0; i < 100; i++) {
            const x = Math.random() * 512, y = Math.random() * 256, r = Math.random() * 12 + 3;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(30,30,30,0.25)"; ctx.fill();
            ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.2, r * 0.65, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 2; ctx.stroke();
        }
    }
    for (let i = 0; i < 700; i++) {
        ctx.fillStyle = "rgba(255,255,255,0.07)";
        ctx.fillRect(Math.random() * 512, Math.random() * 256, Math.random() * 3 + 1, Math.random() * 3 + 1);
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}

/* 4. SUN */
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 64, 64),
    new THREE.MeshStandardMaterial({map: createTexture("sun", ["#fff5ad", "#ffcc22", "#ff8100", "#b52d00"]), emissive: 0xff8000, emissiveIntensity: 2.5, roughness: 1})
);
scene.add(sun);

const glowCanvas = document.createElement("canvas");
glowCanvas.width = 256; glowCanvas.height = 256;
const glowCtx = glowCanvas.getContext("2d");
const glow = glowCtx.createRadialGradient(128, 128, 10, 128, 128, 128);
glow.addColorStop(0, "rgba(255,180,30,0.8)");
glow.addColorStop(0.35, "rgba(255,110,0,0.25)");
glow.addColorStop(1, "rgba(255,80,0,0)");
glowCtx.fillStyle = glow;
glowCtx.fillRect(0, 0, 256, 256);
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(glowCanvas), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
sunGlow.scale.set(15, 15, 1);
sun.add(sunGlow);

/* 5. PLANET DATA */
const planets = [
    {name: "Mercury", size: 0.38, distance: 5, speed: 0.85, colors: ["#b5a99a", "#77716d", "#45413f"]},
    {name: "Venus", size: 0.65, distance: 7, speed: 0.65, colors: ["#ffe0a0", "#d59b53", "#8b5128"]},
    {name: "Earth", size: 0.72, distance: 9.5, speed: 0.46, colors: ["#5ab9ef", "#1464ac", "#082d70"], type: "earth"},
    {name: "Mars", size: 0.53, distance: 12, speed: 0.36, colors: ["#ffb18a", "#d04c30", "#70251b"]},
    {name: "Jupiter", size: 1.55, distance: 16, speed: 0.24, colors: ["#f0d3a4", "#c38c5f", "#815038"], type: "jupiter"},
    {name: "Saturn", size: 1.3, distance: 20, speed: 0.18, colors: ["#f7dfaa", "#c3a06c", "#8e7046"], type: "saturn", rings: true},
    {name: "Uranus", size: 0.95, distance: 24, speed: 0.13, colors: ["#c3ffff", "#65c5d0", "#267b91"]},
    {name: "Neptune", size: 0.9, distance: 28, speed: 0.10, colors: ["#80b9ff", "#2454d1", "#101d77"]}
];

/* 6. ORBITS AND PLANETS */
const movingPlanets = [];
let marsPlanet = null;
let earthPlanet = null;

planets.forEach((data) => {
    const points = [];
    for (let i = 0; i <= 180; i++) {
        const a = (i / 180) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(a) * data.distance, 0, Math.sin(a) * data.distance));
    }
    const og = new THREE.BufferGeometry();
    og.setFromPoints(points);
    scene.add(new THREE.Line(og, new THREE.LineBasicMaterial({color: 0x6688bb, transparent: true, opacity: 0.25})));

    const pivot = new THREE.Group();
    scene.add(pivot);

    const planet = new THREE.Mesh(
        new THREE.SphereGeometry(data.size, 48, 48),
        new THREE.MeshStandardMaterial({map: createTexture(data.type || data.name, data.colors), roughness: 0.85, metalness: 0.03})
    );
    planet.position.x = data.distance;
    pivot.add(planet);

    if (data.name === "Earth") earthPlanet = planet;
    if (data.name === "Mars") marsPlanet = planet;

    if (data.rings) {
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(data.size * 1.35, data.size * 2.2, 100),
            new THREE.MeshStandardMaterial({color: 0xd8bc8a, side: THREE.DoubleSide, transparent: true, opacity: 0.85, roughness: 0.8})
        );
        ring.rotation.x = -Math.PI / 2;
        ring.rotation.z = 0.3;
        planet.add(ring);
    }
    movingPlanets.push({name: data.name, pivot, planet, speed: data.speed});
});

/* 7.2 Ceres, Eros, Pioneer, Kepler */
function addBody(o) {
    const pivot = new THREE.Group();
    pivot.rotation.y = o.angle;
    scene.add(pivot);

    const material = o.colors
        ? new THREE.MeshStandardMaterial({map: createTexture("moon", o.colors), roughness: 0.95})
        : new THREE.MeshBasicMaterial({visible: false});

    const geometry = new THREE.SphereGeometry(o.radius, 48, 48);
    if (o.shape) geometry.scale(o.shape[0], o.shape[1], o.shape[2]);

    if (o.orbit) {
        const pts = [];
        for (let i = 0; i <= 180; i++) {
            const a = (i / 180) * Math.PI * 2;
            pts.push(new THREE.Vector3(Math.cos(a) * o.distance, 0, Math.sin(a) * o.distance));
        }
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: o.orbit, transparent: true, opacity: 0.22})));
    }

    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.x = o.distance;
    pivot.add(mesh);
    movingPlanets.push({name: o.name, pivot, planet: mesh, speed: o.speed, spin: o.spin});
    return mesh;
}

Object.values(landmarkData).forEach((group) => {
    group.items.forEach((item) => {
        const lat = THREE.MathUtils.degToRad(item.lat);
        const lon = THREE.MathUtils.degToRad(item.lon);
        const normal = new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));

        const model = (kindModels[item.kind] || makeLander)();
        model.scale.setScalar(group.modelScale);
        model.position.copy(normal).multiplyScalar(group.radius * (1 + (item.altitude || 0)));
        model.quaternion.setFromUnitVectors(upAxis, normal);
        spinQ.setFromAxisAngle(normal, itemIndex * 1.7);
        model.quaternion.premultiply(spinQ);
        group.mesh.add(model);
        itemIndex++;

        const anchor = new THREE.Object3D();
        anchor.position.set(0, 2.8, 0);
        model.add(anchor);

        const el = document.createElement("div");
        el.className = "poi-label";
        el.innerHTML = '<span class="poi-dot"></span><span class="poi-text"></span>';
        labelsRoot.appendChild(el);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "equip-item";
        btn.style.display = "none";
        equipList.appendChild(btn);

        const entry = {
            mesh: group.mesh, anchor, normal, el, btn, model,
            alwaysVisible: !!group.alwaysVisible,
            text: el.querySelector(".poi-text"),
            item, icon: kindIcons[item.kind] || "🛰️", lang: ""
        };

        btn.addEventListener("click", () => selectEquipment(entry, true));
        btn.addEventListener("dblclick", () => openInfo(entry));
        landmarks.push(entry);
    });
});

const poiPos = new THREE.Vector3();
const poiNormal = new THREE.Vector3();
const poiView = new THREE.Vector3();
const modelPos = new THREE.Vector3();

let panelLang = "";
let panelObject = null;

function refreshPanel(lang) {
    panelLang = lang;
    panelObject = selectedObject;

    if (selectedObject) {
        equipTitle.textContent = panelTitles[bodyKeyOf(selectedObject)][lang];
    }
    landmarks.forEach((l) => {
        l.btn.style.display = l.mesh === selectedObject ? "block" : "none";
        if (l.mesh !== selectedObject) l.btn.classList.remove("active");
    });
    if (infoEl.classList.contains("open")) renderInfo();
    if (storyEl.classList.contains("open")) renderStory();
}

function updateLandmarks() {
    const lang = document.documentElement.lang === "en" ? "en" : "ar";
    camera.updateMatrixWorld();
    if (panelLang !== lang || panelObject !== selectedObject) refreshPanel(lang);

    landmarks.forEach((l) => {
        if (l.lang !== lang) {
            l.text.textContent = l.icon + " " + l.item[lang];
            l.btn.textContent = l.icon + " " + l.item[lang];
            l.lang = lang;
        }

        let visible = false;

        if (selectedObject === l.mesh) {
            l.anchor.getWorldPosition(poiPos);
            poiNormal.copy(l.normal).transformDirection(l.mesh.matrixWorld);
            poiView.copy(camera.position).sub(poiPos);
            const distance = poiView.length();
            poiView.normalize();

            if (distance < 14 && (l.alwaysVisible || poiNormal.dot(poiView) > 0.1)) {
                poiPos.project(camera);
                if (poiPos.z < 1) {
                    const x = (poiPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-poiPos.y * 0.5 + 0.5) * window.innerHeight;
                    l.el.style.transform = `translate(${x}px, ${y}px)`;
                    visible = true;

                    l.ax = x;
                    l.ay = y;
                    l.model.getWorldPosition(modelPos);
                    modelPos.project(camera);
                    l.mx = (modelPos.x * 0.5 + 0.5) * window.innerWidth;
                    l.my = (-modelPos.y * 0.5 + 0.5) * window.innerHeight;
                }
            }
        }
        l.vis = visible;
        l.el.classList.toggle("show", visible);
    });
}

const infoStoryBtn = document.getElementById("infoStoryBtn");
const infoClose = document.getElementById("infoClose");
const storyEl = document.getElementById("story");
const storyMedia = document.getElementById("storyMedia");
const storyName = document.getElementById("storyName");
const storyTitle = document.getElementById("storyTitle");
const storyBody = document.getElementById("storyBody");
const storyClose = document.getElementById("storyClose");

function curLang() {
    return document.documentElement.lang === "en" ? "en" : "ar";
}

function makeMedia(l, lang) {
    const wrap = document.createElement("div");
    wrap.className = "media-ph";
    wrap.innerHTML = "<span>" + l.icon + "</span><small>" + ui[lang].imgHere + "</small>";
    if (l.item.image) {
        const img = new Image();
        img.alt = l.item[lang];
        img.onload = () => { wrap.className = "media-img"; wrap.replaceChildren(img); };
        img.src = l.item.image;
        if (img.complete && img.naturalWidth !== 0) {
            wrap.className = "media-img";
            wrap.replaceChildren(img);
        }
    }
    return wrap;
}

function renderInfo() {
    if (!activeEntry) return;
    const lang = curLang();
    const l = activeEntry;
    infoMedia.replaceChildren(makeMedia(l, lang));
    infoName.textContent = l.icon + " " + l.item[lang];
    infoText.textContent = l.item.info[lang];
    infoStoryBtn.textContent = ui[lang].story;
    infoClose.setAttribute("aria-label", ui[lang].close);
}

function renderStory() {
    if (!activeEntry) return;
    const lang = curLang();
    const l = activeEntry;
    const text = (l.item.story[lang] || "").trim();
    storyMedia.replaceChildren(makeMedia(l, lang));
    storyName.textContent = l.icon + " " + l.item[lang];
    storyTitle.textContent = (l.item.story.title && l.item.story.title[lang]) || ui[lang].noTitle;
    storyBody.innerHTML = text || '<p class="story-empty">' + ui[lang].empty + "</p>";
    storyClose.setAttribute("aria-label", ui[lang].close);
}

function selectEquipment(l, fly) {
    activeEntry = l;
    if (fly) flyTo = l;
    landmarks.forEach((x) => x.btn.classList.toggle("active", x === l));
    l.btn.scrollIntoView({block: "nearest"});
}

function openInfo(l) {
    selectEquipment(l, false);
    renderInfo();
    infoEl.classList.add("open");
}
function closeInfo() { infoEl.classList.remove("open"); }
function openStory(l) {
    selectEquipment(l, false);
    closeInfo();
    renderStory();
    storyEl.classList.add("open");
}
function closeStory() { storyEl.classList.remove("open"); }

function pickEquipment(e) {
    let best = null;
    let bestDistance = 34;
    landmarks.forEach((l) => {
        if (!l.vis) return;
        const d = Math.min(Math.hypot(e.clientX - l.ax, e.clientY - l.ay), Math.hypot(e.clientX - l.mx, e.clientY - l.my));
        if (d < bestDistance) { best = l; bestDistance = d; }
    });
    return best;
}

infoStoryBtn.addEventListener("click", () => { if (activeEntry) openStory(activeEntry); });
infoClose.addEventListener("click", closeInfo);
infoEl.addEventListener("click", (e) => { if (e.target === infoEl) closeInfo(); });
storyClose.addEventListener("click", closeStory);
storyEl.addEventListener("click", (e) => { if (e.target === storyEl) closeStory(); });
window.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeStory(); closeInfo(); } });

window.addEventListener("dblclick", (e) => {
    if (!selectedObject) return;
    if (e.target.closest(".story, .equip-panel, button")) return;
    const hit = pickEquipment(e);
    if (hit) openInfo(hit);
});

/* 8. ASTEROID BELT */
const asteroidPositions = [];
for (let i = 0; i < 700; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 13.3 + Math.random() * 1.3;
    const y = (Math.random() - 0.5) * 0.5;
    asteroidPositions.push(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
}
const asteroidGeometry = new THREE.BufferGeometry();
asteroidGeometry.setAttribute("position", new THREE.Float32BufferAttribute(asteroidPositions, 3));
const asteroids = new THREE.Points(asteroidGeometry, new THREE.PointsMaterial({color: 0xb6a58d, size: 0.09, sizeAttenuation: true}));
scene.add(asteroids);

/* 9. STARS */
const starPositions = [];
for (let i = 0; i < 2500; i++) {
    starPositions.push((Math.random() - 0.5) * 180, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 180);
}
const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
const starField = new THREE.Points(starGeometry, new THREE.PointsMaterial({color: 0xffffff, size: 0.12, transparent: true, opacity: 0.85}));
scene.add(starField);

/* 10. CAMERA CONTROL */
let zoomK = 1;
const cameraTarget = new THREE.Vector3(0, 0, 0);
const desiredTarget = new THREE.Vector3(0, 0, 0);
const desiredCamera = new THREE.Vector3(0, 24, 53);
const cameraOffset = new THREE.Vector3();
const worldPosition = new THREE.Vector3();
const defaultCamera = new THREE.Vector3(0, 24, 53);

const heroContent = document.getElementById("heroContent");
const aboutSection = document.getElementById("about"); // قسم about متعلّق في الـ HTML، فممكن يكون null

window.focusSpaceObject = function (object) {
    const clickedObject = bodies[object].mesh;
    selectedObject = selectedObject === clickedObject ? null : clickedObject;

    const hide = selectedObject !== null;
    heroContent.classList.toggle("fade-out", hide);
    if (aboutSection) aboutSection.classList.toggle("fade-out", hide);
    document.body.classList.toggle("exploring", hide);

    document.querySelectorAll("[data-btn]").forEach((b) => {
        b.classList.toggle("active", selectedObject !== null && bodies[b.dataset.btn].mesh === selectedObject);
    });

    if (!hide) {
        document.body.classList.remove("dragging");
        drag.active = false;
        window.scrollTo(0, 0);
    }

    zoomK = 1;
    flyTo = null;
    activeEntry = null;
    closeInfo();
    closeStory();
    landmarks.forEach((l) => l.btn.classList.remove("active"));
};

/* 10.5 MANUAL ROTATION */
const drag = {active: false, x: 0, y: 0, sx: 0, sy: 0};
const ROTATE_SPEED = 0.008;

const camRight = new THREE.Vector3();
const camUp = new THREE.Vector3();
const qYaw = new THREE.Quaternion();
const qPitch = new THREE.Quaternion();
const qDelta = new THREE.Quaternion();
const qParent = new THREE.Quaternion();
const qParentInv = new THREE.Quaternion();
const qLocal = new THREE.Quaternion();

function rotateSelected(dx, dy) {
    if (!selectedObject) return;
    camera.updateMatrixWorld();
    camRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
    camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
    qYaw.setFromAxisAngle(camUp, dx * ROTATE_SPEED);
    qPitch.setFromAxisAngle(camRight, dy * ROTATE_SPEED);
    qDelta.copy(qYaw).multiply(qPitch);
    applyWorldRotation(qDelta);
}

function applyWorldRotation(q) {
    selectedObject.parent.updateWorldMatrix(true, false);
    selectedObject.parent.getWorldQuaternion(qParent);
    qParentInv.copy(qParent).invert();
    qLocal.copy(qParentInv).multiply(q).multiply(qParent);
    selectedObject.quaternion.premultiply(qLocal);
}

const qStep = new THREE.Quaternion();
const qFull = new THREE.Quaternion();
const qIdentity = new THREE.Quaternion();
const flyNormal = new THREE.Vector3();
const flyView = new THREE.Vector3();
const flyCenter = new THREE.Vector3();

function updateFlyTo() {
    if (!flyTo || flyTo.mesh !== selectedObject) { flyTo = null; return; }
    selectedObject.updateWorldMatrix(true, false);
    selectedObject.getWorldPosition(flyCenter);
    flyNormal.copy(flyTo.normal).transformDirection(selectedObject.matrixWorld);
    flyView.copy(camera.position).sub(flyCenter).normalize();
    if (flyNormal.angleTo(flyView) < 0.003) { flyTo = null; return; }
    qFull.setFromUnitVectors(flyNormal, flyView);
    qStep.copy(qIdentity).slerp(qFull, 0.1);
    applyWorldRotation(qStep);
}

window.addEventListener("pointerdown", (e) => {
    if (!selectedObject) return;
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest("button, .equip-panel, .story, .space-controls")) return;
    flyTo = null;
    drag.active = true;
    drag.x = e.clientX; drag.y = e.clientY;
    drag.sx = e.clientX; drag.sy = e.clientY;
    document.body.classList.add("dragging");
});

window.addEventListener("pointermove", (e) => {
    if (!drag.active || !selectedObject) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    rotateSelected(dx, dy);
});

function endDrag() {
    drag.active = false;
    document.body.classList.remove("dragging");
}

window.addEventListener("pointerup", (e) => {
    if (drag.active && selectedObject && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) {
        const hit = pickEquipment(e);
        if (hit) selectEquipment(hit, false);
    }
    endDrag();
});
window.addEventListener("pointercancel", endDrag);
window.addEventListener("blur", endDrag);

window.addEventListener("wheel", (e) => {
    if (!selectedObject) return;
    if (e.target.closest(".story, .equip-panel")) return;
    e.preventDefault();
    zoomK = THREE.MathUtils.clamp(zoomK * (1 + e.deltaY * 0.001), 0.35, 1.8);
}, {passive: false});

/* 11. ANIMATION */
const clock = new THREE.Clock();
let hold = 0;

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);

    sun.rotation.y += delta * 0.12;

    hold += ((selectedObject ? 1 : 0) - hold) * 0.12;
    if (selectedObject && hold > 0.999) hold = 1;
    const calm = 1 - hold;

    movingPlanets.forEach((item) => {
        const frozen = selectedObject === item.planet || (selectedObject === moon && item.name === "Earth");
        const k = frozen ? calm : 1;
        item.pivot.rotation.y += delta * item.speed * k;
        item.planet.rotation.y += delta * (item.spin ?? 0.7) * k;
    });

    const moonK = selectedObject === moon ? calm : 1;
    moonPivot.rotation.y += delta * 0.5 * moonK;
    moon.rotation.y += delta * 0.3 * moonK;

    asteroids.rotation.y += delta * 0.025;
    starField.rotation.y += delta * 0.002;

    if (selectedObject) {
        selectedObject.getWorldPosition(worldPosition);
        desiredTarget.copy(worldPosition);
        cameraOffset.set(0, 2.2, 5.5).multiplyScalar(zoomK);
        desiredCamera.copy(desiredTarget).add(cameraOffset);
    } else {
        desiredTarget.set(0, 0, 0);
        desiredCamera.copy(defaultCamera);
    }

    cameraTarget.lerp(desiredTarget, 0.045);
    camera.position.lerp(desiredCamera, 0.045);
    camera.lookAt(cameraTarget);

    if (selectedObject) updateFlyTo();

    renderer.render(scene, camera);
    updateLandmarks();
}
animate();

/* 12. RESPONSIVE */
function resizeScene() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener("resize", resizeScene);
resizeScene();

window.__spaceReady = true;
</script>
